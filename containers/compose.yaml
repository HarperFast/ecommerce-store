# Local, production-like benchmark topology.
#
# Two services with SEPARATE, EXPLICIT resource budgets:
#
#   harper  — the target. Gets the whole budget a competing stack would have to split across
#             all of its processes (framework + database + cache + ...). That is the point of
#             the comparison: an architecture spread over three containers pays for all three
#             out of this same budget.
#
#   bench   — the load generator. Deliberately OUTSIDE the target's budget. If the generator
#             spent the budget the architecture is being measured on, it would be quietly
#             taking the thing under test away from itself.
#
# Networking: a user-defined bridge, identical for every target. Recorded with every run.
# Host networking would be faster and would also make any future comparison invalid unless
# every target used it too.

name: harper-ecommerce-bench

services:
  harper:
    # Tagged per build, so two builds of the target can coexist in one session: the orchestrator
    # sets TARGET_CONTEXT and TARGET_IMAGE_TAG when TARGET_REF names a commit (run-benchmark.sh).
    image: harper-ecommerce-bench-harper:${TARGET_IMAGE_TAG:-checkout}
    build:
      context: ${TARGET_CONTEXT:-..}
      # The checkout's Dockerfile for every build, so builds differ only in application code.
      dockerfile: ${TARGET_DOCKERFILE:-containers/Dockerfile}
      args:
        HARPER_VERSION: ${HARPER_VERSION:-5.3.2}
    networks: [bench]
    ports:
      # Published only so a human can poke at it. The measured generator talks over the
      # bridge network, not through these.
      - "9926:9926"
      - "9925:9925"
    volumes:
      # A named volume on a real filesystem. Never tmpfs.
      - harper-data:/data
    environment:
      # Harper's worker-thread count. HARPER_SET_CONFIG takes a JSON object and overrides
      # harper-config.yaml at boot. Unset, Harper derives `threads.count` from os.cpus() — the
      # VM's CPUs, not this container's limit — capped by cgroup memory, which gives 4 workers
      # on a 2-CPU budget. It is pinned to the CPU budget here so the target is not
      # oversubscribed against its own limit, and so the value is explicit in the run record.
      # The object form, not the bare number: 5.3 accepts both, but the number form drops the
      # rest of the `threads` defaults and the startup banner then reports the count as
      # undefined and debugging as enabled.
      # Plain HTTP, deliberately. Outside dev mode Harper defaults to HTTPS on both ports, and
      # TLS termination is a real per-request cost that has nothing to do with the
      # architecture under test. Every target must make the same choice; it is recorded with
      # the run.
      HARPER_SET_CONFIG: '{"threads":{"count":${HARPER_THREADS:-2}},"logging":{"level":"warn","stdStreams":true},"http":{"port":9926,"securePort":null},"operationsApi":{"network":{"port":9925,"securePort":null}}}'
      # Harper's installer prompts interactively unless all three are supplied. Values live in
      # containers/.env — local test credentials for a container that only ever gets
      # benchmarked, reachable only on this compose bridge.
      ROOTPATH: /data/harper
      HDB_ADMIN_USERNAME: ${HDB_ADMIN_USERNAME:-benchadmin}
      HDB_ADMIN_PASSWORD: ${HDB_ADMIN_PASSWORD:?set in containers/.env}
    deploy:
      resources:
        limits:
          cpus: "${TARGET_CPUS:-2}"
          memory: "${TARGET_MEMORY:-2g}"
    # No healthcheck, deliberately. A compose healthcheck execs its probe INSIDE the target
    # every interval for the life of the container — a Node process every 5 s, charged to the
    # budget under measurement for the whole run. Readiness is probed from outside instead
    # (containers/wait-ready.mjs), and no target in a comparison may run one either.

  bench:
    image: node:24-slim
    networks: [bench]
    working_dir: /work
    volumes:
      - ../:/work:ro
      - bench-results:/results
      # Expanded datasets live outside the checkout's tracked tree (.work/ by default), and a
      # worktree can point DATASET_ROOT at another checkout's expansion instead of re-expanding.
      - ${DATASET_ROOT:-../.work/dataset}:/dataset:ro
      # The host's cgroup v2 tree, read-only, so the generator can account the TARGET's CPU per
      # step from its container scope. The generator shares a kernel with the target on both
      # tiers (a Podman VM, a Linux host), and a process inside the generator cannot see the
      # target's processes at all.
      - /sys/fs/cgroup:/host-cgroup:ro
    depends_on:
      harper:
        condition: service_started
    environment:
      TARGET_URL: http://harper:9926
      OPS_URL: http://harper:9925
      # The background write stream authenticates against the operations API. Without these
      # every write 401s, fetch resolves normally, and the SPEC.md the "Background writes" coherence workload
      # silently does not happen while the run record still reports writesIssued.
      HDB_ADMIN_USERNAME: ${HDB_ADMIN_USERNAME:-benchadmin}
      HDB_ADMIN_PASSWORD: ${HDB_ADMIN_PASSWORD:?set in containers/.env}
    deploy:
      resources:
        limits:
          cpus: "${BENCH_CPUS:-2}"
          memory: "${BENCH_MEMORY:-1g}"
    # Started on demand: `compose run --rm bench node bench/run.mjs ...`
    profiles: [manual]
    command: ["sleep", "infinity"]

networks:
  bench:
    driver: bridge

volumes:
  harper-data:
  bench-results:
