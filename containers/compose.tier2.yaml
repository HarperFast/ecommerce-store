# Tier-2 placement: layer over compose.yaml with COMPOSE_EXTRA=compose.tier2.yaml.
#
# The tier-2 Linux host partitions its cores with systemd slices (application-architecture-
# benchmarks, environments/gcp/host-setup.sh): bench-target.slice holds CPUs 2-3 with
# MemoryMax=2G and no swap, bench-generator.slice CPUs 4-7 with 4 GiB, and anything left unplaced
# lands in system.slice on the housekeeping CPUs 0-1. With the systemd cgroup driver a parent is
# named as a slice unit and the dash nests it, so these are bench.slice/bench-target.slice and
# bench.slice/bench-generator.slice. Every container of a target joins the target slice, so the
# kernel enforces one cpuset and one memory limit over the whole stack.
#
# The snapshot and restore steps use `compose run harper`, so they inherit the placement and
# the restore's page cache is charged inside the target's budget.
#
# The target keeps its memory limit and loses its CPU quota:
#
#   - Memory. A container cannot see its slice's limits: its cgroup namespace starts at its own
#     scope, so process.constrainedMemory() reports no limit there (measured in the qualification
#     session). Harper sizes its RocksDB block cache and its worker heaps from that value, so
#     without a container limit it would size from the VM's 60 GB and be OOM-killed by the
#     slice. The 2 GiB limit makes the size explicit, equal to the slice's.
#   - CPU. The slice's cpuset already gives two cores, and Harper's thread count is set
#     explicitly (HARPER_THREADS). A CFS quota on top adds throttling the tier-2 procedure
#     discourages, and no separated stack in the same slice carries one. `!reset` needs
#     Compose 2.24 or later; the tier-2 host installs Docker's current Compose plugin.
#
# The generator keeps its limits: they bound the generator, not the budget under measurement.
services:
  harper:
    cgroup_parent: bench-target.slice
    deploy:
      resources:
        limits:
          cpus: !reset null
  bench:
    cgroup_parent: bench-generator.slice
