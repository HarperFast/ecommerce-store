# Tier-2 placement: layer over compose.yaml with COMPOSE_EXTRA=compose.tier2.yaml.
#
# The tier-2 Linux host partitions its cores with systemd slices: the target's whole budget is
# bench-target.slice (a cpuset and MemoryMax), the generator's is bench-generator.slice, and
# anything left unplaced lands in system.slice on the housekeeping CPUs. Every container of a
# target joins the target slice, so the kernel enforces one budget over the whole stack. See
# application-architecture-benchmarks, environments/gcp. With the systemd cgroup driver a
# parent is named as a slice unit; the dash nests it, so this is bench.slice/bench-target.slice.
#
# The snapshot and restore steps use `compose run harper`, so they inherit the placement and
# the restore's page cache is charged inside the target's budget.
#
# The per-container limits in compose.yaml stay. The CPU quota equals the slice's cpuset, and
# the memory limit is what Harper sizes itself from (process.constrainedMemory(): 25% of it for
# the RocksDB block cache, a share per worker heap). Without it Harper may size from the VM's
# whole memory and be OOM-killed by the slice's MemoryMax.
services:
  harper:
    cgroup_parent: bench-target.slice
  bench:
    cgroup_parent: bench-generator.slice
