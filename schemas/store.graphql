# The eight tables — SPEC.md#data-model, designed in docs/data-model.md.
#
# Deliberately NOT pre-joined. The fan-out across these tables is what the benchmark
# measures (DATA-001), so a shape that collapses a required read is a conformance failure,
# not an optimization.
#
# @sealed everywhere: the dataset is fixed and checksum-verified, so an unexpected attribute
# means a loader bug, and failing loudly at write time beats discovering it in a result.
#
# @indexed only where the application queries: Variant.productId (the product view's variant
# lookup) and the promotion candidate keys (eligibilityKeys, skus). Every other read is by
# primary key or a scan of a small lookup table. An index nothing queries is paid for on every
# load and write and in storage — 62 million entries on Inventory alone at `bench` — and a
# benchmark should not carry dead weight on either side. Add one back with the query that
# needs it.

type Cart @table @export @sealed {
	id: ID @primaryKey
	customerId: String
	# [{ sku, quantity }] — embedded, so reading the cart is ONE read. The per-line fan-out
	# is the second wave; splitting lines out would add a wave the spec does not describe.
	lines: Any
}

type Customer @table @export @sealed {
	id: ID @primaryKey
	tier: String
	loyaltyBalance: Int
	region: String
	taxJurisdiction: String
}

type Product @table @export @sealed {
	id: ID @primaryKey
	title: String
	categoryIds: [String]
	weight: Int
	# Fans out to further Product reads — depth preserved. SPEC.md#foldings-and-what-they-cost.
	relatedProductIds: [String]
	# { count, averageCentistars } — a field, not a table. Nothing in P0 writes reviews.
	reviewRollup: Any
}

type Variant @table @export @sealed {
	sku: ID @primaryKey
	productId: String @indexed
	options: Any
	# Minor units. Mutated by the background writer.
	basePrice: Int
	weight: Int
}

type Inventory @table @export @sealed {
	# `${sku}:${locationId}` — a synthetic key so a line's availability is a bounded set of
	# direct reads on every implementation rather than a scan.
	id: ID @primaryKey
	sku: String
	locationId: String
	onHand: Int
}

type Location @table @export @sealed {
	id: ID @primaryKey
	region: String
	# Lower wins when resolving availability — QUOTE-003.
	priority: Int
}

type Promotion @table @export @sealed {
	id: ID @primaryKey
	kind: String
	# Empty array means "no restriction on this dimension". Kept as the authoritative
	# eligibility data; `isEligible` reads these.
	tiers: [String]
	skus: [String] @indexed
	categoryIds: [String]
	# The dataset's indexable form of tiers and categories: the same values, or ['*'] when
	# unrestricted. Loaded but not queried; eligibilityKeys derives the same keys from the
	# authoritative arrays, so the index cannot drift from what `isEligible` reads.
	tierKeys: [String]
	categoryKeys: [String]
	# Campaigns only (empty `skus`): one entry per (tier, category) pair, `*` standing for an
	# empty array, which no index can match. A promotion naming SKUs gets none: the
	# specification makes it a candidate by its SKUs alone, found through the `skus` index
	# (docs/data-model.md#promotion-eligibility-index). Must build the keys
	# resources/lib/promotion-index.js probes for; scripts/verify-promotion-index.mjs checks.
	eligibilityKeys: [String] @computed(from: "skus?.length ? [] : (tiers?.length ? tiers : ['*']).flatMap((tier) => (categoryIds?.length ? categoryIds : ['*']).map((categoryId) => tier + '|' + categoryId))") @indexed
	thresholdMinor: Int
	amountMinor: Int
	amountBasisPoints: Int
}

type Rate @table @export @sealed {
	id: ID @primaryKey
	kind: String
	region: String
	weightMin: Int
	weightMax: Int
	jurisdiction: String
	amountMinor: Int
	basisPoints: Int
}

# ---------------------------------------------------------------------------------------
# The cache.
#
# GET /product/:id is "mostly cacheable, varies by tier and region" (SPEC.md#get-productidtierregion), so the
# cached unit is the fully-resolved aggregate keyed by `${productId}:${tier}:${region}` —
# 16 entries per product across 4 tiers and 4 regions.
#
# Filled by a sourcedFrom resolver (resources/product.js) that does the fan-out, and kept
# coherent two ways: explicit invalidation by every write through the application's write
# surface, which meets FRESH_MS (CACHE-002), and a 120 s TTL as the backstop for anything the
# write surface does not cover — a write made directly to a table over REST or the operations
# API, as SPEC.md#background-writes describes, converges only on expiry. An
# implementation on a separated stack puts the same aggregate in Redis with the same key;
# what differs is what invalidating it costs, which is exactly what SPEC.md#background-writes measures.
#
# NOT @export'ed: it is an internal cache, not a public surface. Reads go through
# /product/:id so cache status can be reported (OBS-002).

type ProductView @table(expiration: 120) {
	id: ID @primaryKey
	productId: String
	tier: String
	region: String
	payload: Any
}
