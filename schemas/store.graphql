# The eight tables — SPEC.md §3, designed in docs/data-model.md.
#
# Deliberately NOT pre-joined. The fan-out across these tables is what the benchmark
# measures (DATA-001), so a shape that collapses a required read is a conformance failure,
# not an optimization.
#
# @sealed everywhere: the dataset is fixed and checksum-verified, so an unexpected attribute
# means a loader bug, and failing loudly at write time beats discovering it in a result.

type Cart @table @export @sealed {
	id: ID @primaryKey
	customerId: String @indexed
	# [{ sku, quantity }] — embedded, so reading the cart is ONE read. The per-line fan-out
	# is the second wave; splitting lines out would add a wave the spec does not describe.
	lines: Any
}

type Customer @table @export @sealed {
	id: ID @primaryKey
	tier: String @indexed
	loyaltyBalance: Int
	region: String @indexed
	taxJurisdiction: String @indexed
}

type Product @table @export @sealed {
	id: ID @primaryKey
	title: String
	categoryIds: [String] @indexed
	weight: Int
	# Fans out to further Product reads — depth preserved, see docs/data-model.md §foldings.
	relatedProductIds: [String]
	# { count, averageCentistars } — a field, not a table. Nothing in P0 writes reviews.
	reviewRollup: Any
}

type Variant @table @export @sealed {
	sku: ID @primaryKey
	productId: String @indexed
	options: Any
	# Minor units. Mutated by the background writer.
	basePrice: Int
	weight: Int
}

type Inventory @table @export @sealed {
	# `${sku}:${locationId}` — a synthetic key so a line's availability is a bounded set of
	# direct reads on every implementation rather than a scan.
	id: ID @primaryKey
	sku: String @indexed
	locationId: String @indexed
	onHand: Int
}

type Location @table @export @sealed {
	id: ID @primaryKey
	region: String @indexed
	# Lower wins when resolving availability — QUOTE-003.
	priority: Int
}

type Promotion @table @export @sealed {
	id: ID @primaryKey
	kind: String @indexed
	# Empty array means "no restriction on this dimension". Kept as the authoritative
	# eligibility data; `isEligible` reads these.
	tiers: [String]
	skus: [String]
	categoryIds: [String]
	# The indexable form: the same values, or ['*'] when unrestricted. An index cannot match
	# an empty array, so without the sentinel a probe can never return a promotion that
	# applies to everything — which is how the first indexed lookup lost 14% of the corpus.
	tierKeys: [String] @indexed
	categoryKeys: [String] @indexed
	thresholdMinor: Int
	amountMinor: Int
	amountBasisPoints: Int
}

type Rate @table @export @sealed {
	id: ID @primaryKey
	kind: String @indexed
	region: String @indexed
	weightMin: Int
	weightMax: Int
	jurisdiction: String @indexed
	amountMinor: Int
	basisPoints: Int
}

# ---------------------------------------------------------------------------------------
# The cache.
#
# GET /product/:id is "mostly cacheable, varies by tier and region" (SPEC.md §5), so the
# cached unit is the fully-resolved aggregate keyed by `${productId}:${tier}:${region}` —
# 16 entries per product across 4 tiers and 4 regions.
#
# Filled by a sourcedFrom resolver (resources/product.js) that does the fan-out, and kept
# coherent two ways: explicit invalidation on every write that can change it, with the TTL
# as the backstop that bounds staleness even if an invalidation is ever missed. An
# implementation on a separated stack puts the same aggregate in Redis with the same key;
# what differs is what invalidating it costs, which is exactly what SPEC.md §6 measures.
#
# NOT @export'ed: it is an internal cache, not a public surface. Reads go through
# /product/:id so cache status can be reported (OBS-002).

type ProductView @table(expiration: 120) {
	id: ID @primaryKey
	productId: String @indexed
	tier: String
	region: String
	payload: Any
	assembledAt: Long
}
