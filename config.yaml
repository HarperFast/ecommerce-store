# Harper Ecommerce Store — component configuration.
#
# The repo root IS the Harper component root. This is not a stylistic choice:
# `deploy_component` extracts a single directory tree to components/<project> and Harper
# does NOT implement npm's `#path:` monorepo-subdirectory git extension
# (components/Application.ts — parseGitReference returns null for it and the deploy fails
# loudly). A nested app directory would make this repo undeployable by URL.
# See docs/structure.md.

rest: true

graphqlSchema:
  files: 'schemas/*.graphql'

jsResource:
  files: 'resources/*.js'

# --- ORDERING IS LOAD-BEARING -------------------------------------------------
# server-timing MUST be registered before any handler whose time it needs to decompose.
# Earlier-registered http listeners are outer middleware layers. Required by SPEC.md
# OBS-001/OBS-003 and landing with the first endpoint, not after it.
#
# server-timing:
#   package: './server-timing'
#   files: '/*'
# ------------------------------------------------------------------------------
